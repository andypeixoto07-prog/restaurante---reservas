<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Profissional de Mesas & Planta Interativa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b141b;
            --panel-bg: #14232e;
            --panel-border: #394b57;
            --accent-gold: #d9ad57;
            --accent-gold-hover: #c49944;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --st-livre: #26b957;
            --st-reservada: #ef5350;
            --st-ocupada: #42a5f5;
            --st-aguardar: #f59e0b;
            --st-indisponivel: #64748b;
            --wood-table: #76552b;
            --wood-border: #9a7a43;
            --radius-md: 10px;
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }

        header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1700px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand-area { display: flex; align-items: center; gap: 12px; }
        .brand-icon { font-size: 28px; background: rgba(217, 173, 87, 0.15); padding: 6px 10px; border-radius: var(--radius-md); border: 1px solid var(--accent-gold); }
        .brand-area h1 { font-size: 1.2rem; font-weight: 800; }
        .brand-area .subtitulo { font-size: 0.75rem; color: var(--accent-gold); font-weight: 600; text-transform: uppercase; }

        .header-center { display: flex; align-items: center; gap: 6px; }
        .nav-btn {
            background: transparent; border: 0; color: var(--text-muted);
            padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 0.88rem; cursor: pointer;
        }
        .nav-btn.active { color: #0b141b; background: var(--accent-gold); }

        .header-right { display: flex; align-items: center; gap: 10px; }

        .btn {
            border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 700; font-size: 0.88rem;
            cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s ease;
        }
        .btn-gold { background: var(--accent-gold); color: #17120a; }
        .btn-gold:hover { background: var(--accent-gold-hover); }
        .btn-music { background: #8b5cf6; color: #fff; }
        .btn-music.ativo { background: #ec4899; box-shadow: 0 0 12px #ec4899; }
        .btn-secondary { background: #334155; color: #fff; }
        .btn-danger { background: #ef5350; color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--panel-border); color: var(--text-main); }
        .btn-outline:hover { background: rgba(255,255,255,0.05); }

        .conteudo { max-width: 1700px; margin: 0 auto; padding: 16px; width: 100%; flex: 1; }
        .tab-page { display: none; }
        .tab-page.active { display: block; }

        /* MODO ECRÃ COMPLETO */
        .mapa-viewport-fullscreen {
            position: fixed !important; inset: 0 !important; z-index: 9999 !important;
            width: 100vw !important; height: 100vh !important; max-height: 100vh !important;
            background: #0d161d !important; border: 0 !important; border-radius: 0 !important;
            padding: 20px; display: flex; justify-content: center; align-items: center;
        }

        .layout-mapa { display: grid; grid-template-columns: minmax(750px, 1fr) 320px; gap: 16px; }

        .mapa-viewport {
            background: #172126; border: 2px solid #596872; border-radius: var(--radius-md);
            overflow: auto; position: relative; max-height: 800px;
        }

        .mapa-canvas {
            position: relative; width: 1050px; height: 750px; background-color: #121c22;
            background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 0);
            background-size: 20px 20px; margin: 0 auto;
        }

        .parede { position: absolute; inset: 10px; border: 3px solid #080b0d; pointer-events: none; }
        .porta-icon { position: absolute; top: 0; left: 620px; font-size: 1.5rem; pointer-events: none; }
        .balcao-obj {
            position: absolute; left: 680px; bottom: 25px; width: 170px; height: 60px;
            background: #68431e; border: 2px solid #a07031; border-radius: 6px;
            display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff;
        }

        /* PISTA DE DANÇA / DJ AMOVÍVEL */
        .dj-booth {
            position: absolute; left: 520px; top: 200px; width: 250px; height: 210px;
            background: radial-gradient(circle, rgba(139,92,246,0.35) 0%, rgba(236,72,153,0.15) 70%);
            border: 2px dashed #ec4899; border-radius: 12px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: #f472b6; font-weight: 800;
            box-shadow: 0 0 20px rgba(236,72,153,0.3); z-index: 10; user-select: none;
        }
        .dj-booth.draggable { cursor: move; border-color: #facc15; }

        /* MESAS */
        .mesa {
            position: absolute; display: flex; flex-direction: column; justify-content: center;
            align-items: center; background: var(--wood-table); border: 2px solid var(--wood-border);
            color: #fff; font-weight: 800; font-size: 0.82rem; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer; user-select: none; transition: transform 0.15s ease;
        }
        .mesa:hover { transform: scale(1.05); z-index: 30; }
        .mesa.draggable { cursor: move; outline: 2px dashed var(--accent-gold); }
        .mesa.selecionada-grupo { outline: 3px solid #38bdf8 !important; }

        .mesa small { font-size: 9px; font-weight: 500; color: #f2e4c6; }
        .mesa .estado-dot { position: absolute; right: 4px; top: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--st-livre); }

        .mesa.st-reservada .estado-dot { background: var(--st-reservada); }
        .mesa.st-ocupada .estado-dot { background: var(--st-ocupada); }
        .mesa.st-aguardar .estado-dot { background: var(--st-aguardar); }

        /* FORMATOS DE MESA */
        .retangular { width: 100px; height: 55px; border-radius: 6px; }
        .quadrada { width: 52px; height: 52px; border-radius: 6px; }
        .redonda { width: 72px; height: 72px; border-radius: 50%; }
        .grande { width: 210px; height: 60px; border-radius: 30px; }

        .mapa-header-bar {
            background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: var(--radius-md);
            padding: 10px 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }

        .painel-lateral { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: var(--radius-md); padding: 16px; }
        .painel-lateral h2 { font-size: 1.1rem; color: var(--accent-gold); margin-bottom: 12px; border-bottom: 1px solid var(--panel-border); padding-bottom: 6px; }

        .reserva-card-side { background: rgba(0,0,0,0.25); border: 1px solid var(--panel-border); border-radius: 6px; padding: 10px; margin-bottom: 8px; }

        /* MODAIS */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 1000; }
        .modal.aberto { display: flex; }
        .caixa-modal { background: var(--panel-bg); border: 1px solid var(--accent-gold); border-radius: 12px; padding: 22px; width: min(520px, 94vw); max-height: 90vh; overflow-y: auto; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group-full { grid-column: span 2; }

        input, select, textarea { width: 100%; padding: 9px 12px; background: var(--bg-dark); color: #fff; border: 1px solid var(--panel-border); border-radius: 6px; font-size: 0.88rem; }
        label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; display: block; }

        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
        .toast { background: #1e293b; color: #fff; padding: 12px 18px; border-radius: 6px; border-left: 4px solid var(--accent-gold); font-size: 0.88rem; }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="brand-area">
                <span class="brand-icon">🍽️</span>
                <div>
                    <h1 id="rest-title-display">Restaurante Gourmet</h1>
                    <div class="subtitulo">Planta Interativa & Reservas</div>
                </div>
            </div>

            <nav class="header-center">
                <button class="nav-btn active" data-tab="mapa">🗺️ Planta do Restaurante</button>
                <button class="nav-btn" data-tab="reservas">📋 Reservas</button>
            </nav>

            <div class="header-right">
                <button id="btn-fullscreen" class="btn btn-outline" onclick="toggleFullscreen()">🖥️ Ecrã Completo</button>
                <button id="btn-musica-ao-vivo" class="btn btn-music" onclick="toggleModoMusica()">🎵 Música ao Vivo (OFF)</button>
                <button class="btn btn-gold" onclick="abrirNovaReservaModal()">+ Nova Reserva</button>
            </div>
        </div>
    </header>

    <div class="conteudo">
        <div id="toast-container"></div>

        <!-- PLANTA DO RESTAURANTE -->
        <section id="tab-mapa" class="tab-page active">
            <div class="mapa-header-bar">
                <div style="display:flex; gap:12px; font-size:0.85rem; align-items:center; flex-wrap:wrap;">
                    <span>🟢 Livre</span>
                    <span>🔴 Reservada</span>
                    <span>🔵 Ocupada</span>
                </div>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button class="btn btn-outline" onclick="abrirModalCriarMesa()">➕ Criar Mesa</button>
                    <button id="btn-modo-grupo" class="btn btn-outline" onclick="toggleModoGrupo()">🔗 Juntar Mesas</button>
                    <button id="btn-edit-layout" class="btn btn-secondary" onclick="toggleEditLayout()">✏️ Mover / Configurar Mapa</button>
                    <button id="btn-save-layout" class="btn btn-gold" style="display:none;" onclick="salvarPosicoesLayout()">💾 Guardar Alterações</button>
                </div>
            </div>

            <div class="layout-mapa">
                <div id="mapa-viewport-element" class="mapa-viewport">
                    <div id="restaurant-map-canvas" class="mapa-canvas">
                        <div class="parede"></div>
                        <div class="porta-icon">🚪</div>
                        <div class="balcao-obj">BALCÃO</div>

                        <!-- PISTA DE DANÇA / DJ -->
                        <div id="dj-booth-element" class="dj-booth" style="display:none;">
                            <div style="font-size:1.6rem;">🎧 🎷</div>
                            <div>PISTA DE DANÇA</div>
                            <div style="font-size:0.75rem; color:#fbcfe8;">Música ao Vivo</div>
                        </div>
                    </div>
                </div>

                <aside class="painel-lateral">
                    <h2>📅 Reservas de Hoje</h2>
                    <div id="reservas-hoje-sidebar"></div>
                </aside>
            </div>
        </section>

        <!-- LISTA DE RESERVAS -->
        <section id="tab-reservas" class="tab-page">
            <div style="background:var(--panel-bg); padding:16px; border-radius:var(--radius-md); border:1px solid var(--panel-border);">
                <h2>Todas as Reservas</h2>
                <div id="lista-reservas-completa" style="margin-top:12px;"></div>
            </div>
        </section>
    </div>

    <!-- MODAL 1: EDITAR MESA (Nº, CAPACIDADE, ROTAÇÃO E REMOVER) -->
    <div class="modal" id="modalInfo">
        <div class="caixa-modal">
            <h2 id="infoTitulo">Mesa --</h2>
            
            <div class="form-grid" style="margin-bottom:12px;">
                <div class="form-group">
                    <label>Número / Nome da Mesa:</label>
                    <input type="text" id="edit-mesa-nome">
                </div>
                <div class="form-group">
                    <label>Nº de Pessoas (Sem Limite):</label>
                    <input type="number" id="edit-mesa-capacidade" min="1">
                </div>
                <div class="form-group form-group-full">
                    <label>Rotação da Mesa (Retangulares):</label>
                    <select id="edit-mesa-rotacao">
                        <option value="0">0° (Horizontal)</option>
                        <option value="90">90° (Vertical)</option>
                        <option value="180">180°</option>
                        <option value="270">270°</option>
                    </select>
                </div>
            </div>

            <div style="display:flex; justify-content:space-between; gap:8px;">
                <button class="btn btn-danger" onclick="removerMesaAtual()">🗑️ Eliminar Mesa</button>
                <button class="btn btn-gold" onclick="guardarAlteracoesMesa()">Guardar Alterações</button>
            </div>

            <hr style="margin:16px 0; border-color:var(--panel-border);">

            <div id="infoTexto"></div>

            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px;">
                <button class="btn btn-gold" id="infoBtnReservar">Reservar Esta Mesa</button>
                <button class="btn btn-outline" onclick="fecharModal('modalInfo')">Fechar</button>
            </div>
        </div>
    </div>

    <!-- MODAL 2: CONFIGURAR PISTA DE DANÇA -->
    <div class="modal" id="modalPista">
        <div class="caixa-modal">
            <h2>⚙️ Configurar Pista de Dança / DJ</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Largura (px):</label>
                    <input type="number" id="pista-largura" value="250">
                </div>
                <div class="form-group">
                    <label>Altura (px):</label>
                    <input type="number" id="pista-altura" value="210">
                </div>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
                <button class="btn btn-gold" onclick="aplicarDimensoesPista()">Aplicar Dimensões</button>
                <button class="btn btn-outline" onclick="fecharModal('modalPista')">Fechar</button>
            </div>
        </div>
    </div>

    <!-- MODAL 3: CRIAR MESA -->
    <div class="modal" id="modalCriarMesa">
        <div class="caixa-modal">
            <h2>➕ Adicionar Nova Mesa</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Número / Nome *</label>
                    <input type="text" id="nova-mesa-nome" placeholder="Ex: 41">
                </div>
                <div class="form-group">
                    <label>Capacidade (Nº Pessoas) *</label>
                    <input type="number" id="nova-mesa-cap" value="4">
                </div>
                <div class="form-group form-group-full">
                    <label>Formato da Mesa *</label>
                    <select id="nova-mesa-formato">
                        <option value="quadrada">Quadrada</option>
                        <option value="retangular">Retangular</option>
                        <option value="redonda">Redonda</option>
                        <option value="grande">Grande / Osso</option>
                    </select>
                </div>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
                <button class="btn btn-outline" onclick="fecharModal('modalCriarMesa')">Cancelar</button>
                <button class="btn btn-gold" onclick="confirmarCriarMesa()">Adicionar Mesa</button>
            </div>
        </div>
    </div>

    <!-- MODAL 4: CRIAR RESERVA -->
    <div class="modal" id="modalReserva">
        <div class="caixa-modal">
            <h2>Nova Reserva</h2>
            <form onsubmit="guardarReserva(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nome do Cliente *</label>
                        <input type="text" id="res-nome" required>
                    </div>
                    <div class="form-group">
                        <label>Telefone *</label>
                        <input type="tel" id="res-telefone" required>
                    </div>
                    <div class="form-group">
                        <label>Data *</label>
                        <input type="date" id="res-data" required>
                    </div>
                    <div class="form-group">
                        <label>Hora *</label>
                        <input type="time" id="res-hora" value="20:00" required>
                    </div>
                    <div class="form-group">
                        <label>Nº de Pessoas *</label>
                        <input type="number" id="res-pessoas" min="1" value="2" required>
                    </div>
                    <div class="form-group">
                        <label>Mesa *</label>
                        <select id="res-mesa"></select>
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
                    <button type="button" class="btn btn-outline" onclick="fecharModal('modalReserva')">Cancelar</button>
                    <button type="submit" class="btn btn-gold">Guardar Reserva</button>
                </div>
            </form>
        </div>
    </div>

            { id: "7", nome: "Mesa 7", capacidade: 8, classe: "redonda", tipo: "redonda", x: 865, y: 300, rotacao: 0 },
            { id: "2", nome: "Mesa 2", capacidade: 8, classe: "redonda", tipo: "redonda", x: 960, y: 380, rotacao: 0 },
            { id: "8", nome: "Mesa 8", capacidade: 8, classe: "redonda", tipo: "redonda", x: 865, y: 460, rotacao: 0 },
            { id: "1", nome: "Mesa 1", capacidade: 8, classe: "redonda", tipo: "redonda", x: 960, y: 540, rotacao: 0 },
            { id: "9", nome: "Mesa 9", capacidade: 8, classe: "redonda", tipo: "redonda", x: 865, y: 540, rotacao: 0 }
        ];

        const MESAS_PISTA = ["10", "11", "12", "14", "15", "16", "17", "18", "19"];

        let mesas = [];
        let reservas = [];
        let modoEdicao = false;
        let modoMusica = false;
        let modoGrupo = false;
        let mesasGrupoSelecionadas = [];
        let mesaSelecionadaId = null;
        let pistaConfig = { x: 520, y: 200, width: 250, height: 210 };

        document.addEventListener("DOMContentLoaded", () => {
            carregarDados();
            iniciarNavegacao();
            renderizarTudo();
            configurarDragPista();
        });

        function carregarDados() {
            const m = localStorage.getItem("mesas_v4");
            mesas = m ? JSON.parse(m) : JSON.parse(JSON.stringify(MESAS_PADRAO));

            const r = localStorage.getItem("reservas_v4");
            reservas = r ? JSON.parse(r) : [];

            const p = localStorage.getItem("pista_v4");
            if (p) pistaConfig = JSON.parse(p);
        }

        function guardarDados() {
            localStorage.setItem("mesas_v4", JSON.stringify(mesas));
            localStorage.setItem("reservas_v4", JSON.stringify(reservas));
            localStorage.setItem("pista_v4", JSON.stringify(pistaConfig));
        }

        function renderizarTudo() {
            renderizarMapa();
            renderizarSidebar();
            atualizarSelectMesas();
        }

        function renderizarMapa() {
            const canvas = document.getElementById("restaurant-map-canvas");
            canvas.querySelectorAll(".mesa").forEach(el => el.remove());

            const hoje = getHojeISO();

            mesas.forEach(m => {
                if (modoMusica && MESAS_PISTA.includes(m.id)) return;

                const el = document.createElement("div");
                el.className = `mesa ${m.classe}`;
                if (modoEdicao) el.classList.add("draggable");
                if (mesasGrupoSelecionadas.includes(m.id)) el.classList.add("selecionada-grupo");

                el.style.left = `${m.x}px`;
                el.style.top = `${m.y}px`;
                el.style.transform = `rotate(${m.rotacao || 0}deg)`;
                el.dataset.id = m.id;

                const res = reservas.find(r => r.mesa === m.id && r.data === hoje);
                if (res) el.classList.add("st-reservada");

                el.innerHTML = `
                    ${m.id}
                    <small>${m.capacidade} pax</small>
                    <i class="estado-dot"></i>
                `;

                el.addEventListener("click", () => {
                    if (modoGrupo) {
                        toggleMesaNoGrupo(m.id);
                    } else if (!modoEdicao) {
                        abrirModalInfoMesa(m.id);
                    }
                });

                el.addEventListener("mousedown", iniciarDragMesa);

                canvas.appendChild(el);
            });

            // Atualiza Pista de Dança
            const dj = document.getElementById("dj-booth-element");
            dj.style.left = `${pistaConfig.x}px`;
            dj.style.top = `${pistaConfig.y}px`;
            dj.style.width = `${pistaConfig.width}px`;
            dj.style.height = `${pistaConfig.height}px`;
        }

        // EDICÃO & MOVER MESAS
        function toggleEditLayout() {
            modoEdicao = !modoEdicao;
            const dj = document.getElementById("dj-booth-element");
            document.getElementById("btn-edit-layout").textContent = modoEdicao ? "❌ Cancelar" : "✏️ Mover / Configurar Mapa";
            document.getElementById("btn-save-layout").style.display = modoEdicao ? "inline-block" : "none";

            if (modoEdicao) {
                dj.classList.add("draggable");
                dj.onclick = () => abrirModal("modalPista");
                mostrarToast("Modo de edição ativo. Arraste mesas ou a pista de dança.");
            } else {
                dj.classList.remove("draggable");
                dj.onclick = null;
                carregarDados();
            }
            renderizarMapa();
        }

        function salvarPosicoesLayout() {
            modoEdicao = false;
            document.getElementById("btn-edit-layout").textContent = "✏️ Mover / Configurar Mapa";
            document.getElementById("btn-save-layout").style.display = "none";
            guardarDados();
            renderizarMapa();
            mostrarToast("Alterações no mapa salvas!");
        }

        let arrasteId = null, offset = {x:0, y:0};
        function iniciarDragMesa(e) {
            if (!modoEdicao) return;
            arrasteId = e.currentTarget.dataset.id;
            const rect = e.currentTarget.getBoundingClientRect();
            offset = { x: e.clientX - rect.left, y: e.clientY - rect.top };

            document.addEventListener("mousemove", moverDrag);
            document.addEventListener("mouseup", pararDrag);
        }

        function moverDrag(e) {
            if (!arrasteId) return;
            const canvas = document.getElementById("restaurant-map-canvas").getBoundingClientRect();
            const m = mesas.find(item => item.id === arrasteId);

            if (m) {
                m.x = Math.max(10, Math.min(e.clientX - canvas.left - offset.x, canvas.width - 60));
                m.y = Math.max(10, Math.min(e.clientY - canvas.top - offset.y, canvas.height - 60));
                const el = document.querySelector(`[data-id="${arrasteId}"]`);
                if (el) { el.style.left = `${m.x}px`; el.style.top = `${m.y}px`; }
            }
        }

        function pararDrag() {
            arrasteId = null;
            document.removeEventListener("mousemove", moverDrag);
            document.removeEventListener("mouseup", pararDrag);
        }

        // PISTA DE DANÇA DRAG & RESIZE
        function configurarDragPista() {
            const dj = document.getElementById("dj-booth-element");
            let arrastandoPista = false, pOffset = {x:0, y:0};

            dj.addEventListener("mousedown", (e) => {
                if (!modoEdicao) return;
                arrastandoPista = true;
                const rect = dj.getBoundingClientRect();
                pOffset = { x: e.clientX - rect.left, y: e.clientY - rect.top };

                const moveP = (ev) => {
                    if (!arrastandoPista) return;
                    const canvas = document.getElementById("restaurant-map-canvas").getBoundingClientRect();
                    pistaConfig.x = Math.max(10, Math.min(ev.clientX - canvas.left - pOffset.x, canvas.width - pistaConfig.width));
                    pistaConfig.y = Math.max(10, Math.min(ev.clientY - canvas.top - pOffset.y, canvas.height - pistaConfig.height));
                    dj.style.left = `${pistaConfig.x}px`;
                    dj.style.top = `${pistaConfig.y}px`;
                };

                const stopP = () => {
                    arrastandoPista = false;
                    document.removeEventListener("mousemove", moveP);
                    document.removeEventListener("mouseup", stopP);
                };

                document.addEventListener("mousemove", moveP);
                document.addEventListener("mouseup", stopP);
            });
        }

        function aplicarDimensoesPista() {
            pistaConfig.width = parseInt(document.getElementById("pista-largura").value) || 250;
            pistaConfig.height = parseInt(document.getElementById("pista-altura").value) || 210;
            fecharModal("modalPista");
            renderizarMapa();
            mostrarToast("Tamanho da pista atualizado!");
        }

        // JUNTAR MESAS PARA GRUPOS
        function toggleModoGrupo() {
            modoGrupo = !modoGrupo;
            mesasGrupoSelecionadas = [];
            const btn = document.getElementById("btn-modo-grupo");

            if (modoGrupo) {
                btn.textContent = "✅ Confirmar Junção";
                btn.classList.add("btn-gold");
                mostrarToast("Clica nas mesas que queres juntar em grupo.");
            } else {
                if (mesasGrupoSelecionadas.length > 1) {
                    juntarMesasSelecionadas();
                }
                btn.textContent = "🔗 Juntar Mesas";
                btn.classList.remove("btn-gold");
            }
            renderizarMapa();
        }

        function toggleMesaNoGrupo(id) {
            const idx = mesasGrupoSelecionadas.indexOf(id);
            if (idx === -1) mesasGrupoSelecionadas.push(id);
            else mesasGrupoSelecionadas.splice(idx, 1);
            renderizarMapa();
        }

        function juntarMesasSelecionadas() {
            const nomeGrupo = prompt("Nome do Grupo de Mesas:", `Grupo ${mesasGrupoSelecionadas.join("+")}`);
            if (!nomeGrupo) return;

            const somaPax = mesasGrupoSelecionadas.reduce((acc, id) => {
                const m = mesas.find(x => x.id === id);
                return acc + (m ? parseInt(m.capacidade) : 0);
            }, 0);

            const primeira = mesas.find(x => x.id === mesasGrupoSelecionadas[0]);

            const novaMesaGrupo = {
                id: nomeGrupo,
                nome: nomeGrupo,
                capacidade: somaPax,
                classe: "grande",
                tipo: "grande",
                x: primeira.x,
                y: primeira.y,
                rotacao: 0
            };

            mesas = mesas.filter(m => !mesasGrupoSelecionadas.includes(m.id));
            mesas.push(novaMesaGrupo);

            guardarDados();
            renderizarTudo();
            mostrarToast(`Mesas unidas em ${nomeGrupo}!`);
        }

        // MODAIS E EDITAR MESAS
        function abrirModalInfoMesa(id) {
            mesaSelecionadaId = id;
            const m = mesas.find(x => x.id === id);
            if (!m) return;

            document.getElementById("infoTitulo").textContent = m.nome;
            document.getElementById("edit-mesa-nome").value = m.id;
            document.getElementById("edit-mesa-capacidade").value = m.capacidade;
            document.getElementById("edit-mesa-rotacao").value = m.rotacao || 0;

            document.getElementById("infoTexto").innerHTML = `<p>Capacidade: <strong>${m.capacidade} Pessoas</strong></p>`;
            document.getElementById("infoBtnReservar").onclick = () => { fecharModal("modalInfo"); abrirNovaReservaModal(m.id); };

            abrirModal("modalInfo");
        }

        function guardarAlteracoesMesa() {
            const m = mesas.find(x => x.id === mesaSelecionadaId);
            if (!m) return;

            const novoNome = document.getElementById("edit-mesa-nome").value.trim();
            const novaCap = parseInt(document.getElementById("edit-mesa-capacidade").value);
            const novaRot = parseInt(document.getElementById("edit-mesa-rotacao").value);

            if (novoNome) m.id = novoNome;
            if (novaCap) m.capacidade = novaCap;
            m.rotacao = novaRot;

            guardarDados();
            fecharModal("modalInfo");
            renderizarTudo();
            mostrarToast("Mesa atualizada!");
        }

        function removerMesaAtual() {
            if (confirm(`Eliminar ${mesaSelecionadaId}?`)) {
                mesas = mesas.filter(x => x.id !== mesaSelecionadaId);
                guardarDados();
                fecharModal("modalInfo");
                renderizarTudo();
            }
        }

        function abrirModalCriarMesa() {
            document.getElementById("nova-mesa-nome").value = "";
            abrirModal("modalCriarMesa");
        }

        function confirmarCriarMesa() {
            const nome = document.getElementById("nova-mesa-nome").value.trim();
            const cap = parseInt(document.getElementById("nova-mesa-cap").value);
            const fmt = document.getElementById("nova-mesa-formato").value;

            if (!nome) return;

            mesas.push({
                id: nome, nome: "Mesa " + nome, capacidade: cap, classe: fmt, tipo: fmt, x: 450, y: 300, rotacao: 0
            });

            guardarDados();
            fecharModal("modalCriarMesa");
            renderizarTudo();
        }

        function toggleModoMusica() {
            modoMusica = !modoMusica;
            const btn = document.getElementById("btn-musica-ao-vivo");
            const dj = document.getElementById("dj-booth-element");

            btn.textContent = modoMusica ? "🎷 Música ao Vivo (ON)" : "🎵 Música ao Vivo (OFF)";
            btn.classList.toggle("ativo", modoMusica);
            dj.style.display = modoMusica ? "flex" : "none";

            renderizarMapa();
        }

        function toggleFullscreen() {
            const vp = document.getElementById("mapa-viewport-element");
            vp.classList.toggle("mapa-viewport-fullscreen");
        }

        // RESERVAS
        function abrirNovaReservaModal(mesaId = null) {
            document.getElementById("res-data").value = getHojeISO();
            if (mesaId) document.getElementById("res-mesa").value = mesaId;
            abrirModal("modalReserva");
        }

        function guardarReserva(e) {
            e.preventDefault();
            const nova = {
                id: "res_" + Date.now(),
                nome: document.getElementById("res-nome").value,
                telefone: document.getElementById("res-telefone").value,
                data: document.getElementById("res-data").value,
                hora: document.getElementById("res-hora").value,
                pessoas: document.getElementById("res-pessoas").value,
                mesa: document.getElementById("res-mesa").value
            };
            reservas.push(nova);
            guardarDados();
            fecharModal("modalReserva");
            renderizarTudo();
        }

        function renderizarSidebar() {
            const hoje = getHojeISO();
            const resHoje = reservas.filter(r => r.data === hoje);
            const c = document.getElementById("reservas-hoje-sidebar");

            c.innerHTML = resHoje.length === 0 ? `<p style="color:var(--text-muted);">Sem reservas hoje.</p>` :
                resHoje.map(r => `
                    <div class="reserva-card-side">
                        <strong>${r.hora} - ${r.nome}</strong>
                        <p>Mesa ${r.mesa} · 👥 ${r.pessoas} pax</p>
                    </div>
                `).join("");
        }

        function atualizarSelectMesas() {
            const s = document.getElementById("res-mesa");
            s.innerHTML = mesas.map(m => `<option value="${m.id}">${m.id} (${m.capacidade} pax)</option>`).join("");
        }

        function iniciarNavegacao() {
            document.querySelectorAll(".nav-btn").forEach(b => {
                b.onclick = () => {
                    document.querySelectorAll(".nav-btn").forEach(x => x.classList.remove("active"));
                    document.querySelectorAll(".tab-page").forEach(x => x.classList.remove("active"));
                    b.classList.add("active");
                    document.getElementById(`tab-${b.dataset.tab}`).classList.add("active");
                };
            });
        }

        function abrirModal(id) { document.getElementById(id).classList.add("aberto"); }
        function fecharModal(id) { document.getElementById(id).classList.remove("aberto"); }
        function getHojeISO() { return new Date().toISOString().split("T")[0]; }
        function mostrarToast(m) {
            const c = document.getElementById("toast-container");
            const t = document.createElement("div");
            t.className = "toast"; t.textContent = m;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
    </script>
</body>
</html>
